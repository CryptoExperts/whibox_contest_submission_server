version: "3.9"

x-recaptcha-variables: &recaptcha-variables
    RECAPTCHA_PUBLIC_KEY: '6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI' #'6Le3QBoUAAAAANKiIexuJsV5XE_HjgqICK2kHGCb'
    RECAPTCHA_PRIVATE_KEY: '6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe' #'6Le3QBoUAAAAALLIh0LrUMsIT8F1lV5fr3eqzj4x'
    SECRET_KEY: 'da39a3ee5e6b4b0d3255bfef95601890afd80709'

x-date-variables: &date-variables
    STARTING_DATE: 1715687940       # 1716811140   # In seconds since EPOCH. Must be identical in the web service. 17/05/2021 00:00 UTC is 1621209600
    POSTING_DEADLINE: 1723204740    # In seconds since EPOCH. Must be identical in the web service. 22/08/2021 00:00 UTC is 1629590400
    FINAL_DEADLINE: 1725278340      # In seconds since EPOCH. Must be identical in the web service. 11/09/2021 00:00 UTC is 1631318400

x-db-variables: &db-variables
    MYSQL_DATABASE: 'db_wb'
    MYSQL_USER: 'user_wb'
    MYSQL_PASSWORD: 'a_not_so_random_user_password'

x-db-server-variables: &db-server-variables
    MYSQL_HOST: 'mysql'
    MYSQL_PORT: 3306

x-challenge-variables: &challenge-variables
    CHALLENGE_MAX_SOURCE_SIZE_IN_MB: 100        # In MB. Must be identical in the launcher service. Must be 50 in production.
    CHALLENGE_MAX_MEM_COMPILATION_IN_MB: 800    # In MB. Must be identical in the launcher service. Must be 500 in production.
    CHALLENGE_MAX_TIME_COMPILATION_IN_SECS: 150 # In seconds. Must be identical in the launcher service. Must be 100 in production.
    CHALLENGE_MAX_BINARY_SIZE_IN_MB: 50         # In MB. Must be identical in the launcher service. Must be 20 in production.
    CHALLENGE_MAX_MEM_EXECUTION_IN_MB: 50       # In MB. Must be identical in the launcher service. Must be 20 in production.
    CHALLENGE_MAX_TIME_EXECUTION_IN_SECS: 10    # In seconds. Must be identical in the launcher service. Must be 1 in production.
    CHALLENGE_NUMBER_OF_TEST_VECTORS: 100       # Must be identical in the launcher service. Must be at least 1000 in production.
    CHALLENGE_TEST_EDGE_CASES: '[0, 2**256 - 1, 0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551]' # Challenge edge cases to be tested.

services:

    web:
        image: crx/web-prod
        networks:
            - front_network
        ports:
            - 5000:5000 # The first number is the external port and can be changed, e.g., to 80:5000 (the second number must not be changed)
            #- 5443:5443
        volumes:
            - /volumes/whitebox_program_uploads:/uploads
        environment:
            <<: *recaptcha-variables
            <<: *db-variables
            <<: *db-server-variables
            <<: *date-variables
            <<: *challenge-variables

            UPLOAD_FOLDER: '/uploads'
            URL_COMPILE_AND_TEST: 'http://launcher:5000/compile_and_test'

        deploy:
            placement:
                constraints: [node.labels.vm == node-manager-ecdsa]

    launcher:
        image: crx/launcher-prod
        networks:
            - front_network
            - back_network
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /volumes/whitebox_program_uploads:/uploads:ro
            - /volumes/whitebox_program_uploads/compilations:/compilations
        environment:
            <<: *db-variables
            <<: *db-server-variables
            <<: *date-variables
            <<: *challenge-variables
            SOCK: "unix:///var/run/docker.sock"
            NAME_OF_COMPILE_AND_TEST_SERVICE: "prod_compile_and_test"
            COMPILE_AND_TEST_SERVICE_NETWORK: "prod_back_network"

        deploy:
            placement:
                constraints: [node.labels.vm == node-manager-ecdsa]



    mysql:
        image: "mysql:8.0.15"
        user: "1000:50"
        command: "--innodb-use-native-aio=0 --default-authentication-plugin=mysql_native_password --mysqlx=0 --connect-timeout=1000000"
        networks:
            - front_network
        volumes:
            - /volumes/database:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: "a_not_so_random_root_password"
            MYSQL_ALLOW_EMPTY_PASSWORD: "no"
            <<: *db-variables
        deploy:
            placement:
                constraints: [node.labels.vm == node-manager-ecdsa]

networks:
    front_network:
    back_network:
